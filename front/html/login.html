<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }
        h2 { margin-bottom: 1.5rem; color: #333; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; 
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            display: none; 
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        
        <form id="formLogin">
    <input type="text" id="emailUsuario" placeholder="Usuario" required>
    <input type="password" id="passwordUsuario" placeholder="Contraseña" required>
    
    <button type="submit">Entrar</button>
    <button type="button" id="btnRegistro">Registrarse</button>
    <button type="button" id="btnGitHub" style="background-color: blue;">Entrar con GitHub</button>
    <button type="button" id="btnGoogle" style="background-color: blue;">Entrar con Google</button>
    <button type="button" id="btnMagicLink" style="background-color: blue;">Recibir enlace mágico por correo</button>
    
</form>

        <p id="mensajeError" class="error">Credenciales incorrectas</p>
        
    </div>
    <script src="../js/login.js"></script>

</body>
</html>
