<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - EventHub</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1>Panel de Administración</h1>
            <div class="admin-header-actions">
                <span id="adminEmail"></span>
                <button id="btnVolver">Volver</button>
            </div>
        </header>

        <nav class="admin-nav">
            <button class="admin-nav-btn active" data-section="crear">Añadir Evento</button>
            <button class="admin-nav-btn" data-section="crear-sitio">Añadir Sitio</button>
            <button class="admin-nav-btn" data-section="eliminar">Eliminar Evento</button>
            <button class="admin-nav-btn" data-section="gestionar">Gestionar Evento</button>
            <button class="admin-nav-btn" data-section="usuarios">Gestionar Usuarios</button>
        </nav>

        <main class="admin-main">
            <section id="section-crear" class="admin-section active">
                <h2>Añadir Evento</h2>
                <form id="formCrearEvento">
                    <label>Nombre <input type="text" id="inputNombre" required></label>
                    <label>Descripción <textarea id="inputDescripcion"></textarea></label>
                    <label>Sitio <select id="inputSitioID" required><option value="">-- Selecciona un sitio --</option></select></label>
                    <label>Fecha y hora <input type="datetime-local" id="inputFecha" required></label>
                    <label>Compañía <input type="text" id="inputCompania"></label>
                    <label>Duración (min) <input type="number" id="inputDuracion" required></label>
                    <button type="submit">Crear Evento</button>
                </form>
                <div id="mensajeCrear" class="admin-mensaje"></div>
            </section>

            <section id="section-crear-sitio" class="admin-section">
                <h2>Añadir Sitio</h2>
                <form id="formCrearSitio">
                    <label>Nombre <input type="text" id="inputSitioNombre" required></label>
                    <label>Aforo <input type="number" id="inputSitioAforo" required></label>
                    <label>ID del Anfiteatro <input type="text" id="inputSitioAnfiteatro"></label>
                    <button type="submit">Crear Sitio</button>
                </form>
                <div id="mensajeCrearSitio" class="admin-mensaje"></div>
            </section>

            <section id="section-eliminar" class="admin-section">
                <h2>Eliminar Evento</h2>
                <p>Selecciona un evento para eliminarlo:</p>
                <select id="selectEliminar"></select>
                <button id="btnEliminar">Eliminar Evento</button>
                <div id="mensajeEliminar" class="admin-mensaje"></div>
            </section>

            <section id="section-gestionar" class="admin-section">
                <h2>Gestionar Evento</h2>
                <p>Selecciona un evento para editar:</p>
                <select id="selectGestionar"></select>
                <form id="formEditarEvento">
                    <label>Nombre <input type="text" id="editNombre" required></label>
                    <label>Descripción <textarea id="editDescripcion"></textarea></label>
                    <label>Sitio <select id="editSitioID" required><option value="">-- Selecciona un sitio --</option></select></label>
                    <label>Fecha y hora <input type="datetime-local" id="editFecha" required></label>
                    <label>Compañía <input type="text" id="editCompania"></label>
                    <label>Duración (min) <input type="number" id="editDuracion" required></label>
                    <button type="submit">Guardar Cambios</button>
                </form>
                <div id="mensajeGestionar" class="admin-mensaje"></div>
            </section>

            <section id="section-usuarios" class="admin-section">
                <h2>Gestionar Usuarios</h2>
                <div id="usuariosList"></div>
            </section>
        </main>
    </div>

    <script src="../js/admin.js"></script>
</body>
</html>
