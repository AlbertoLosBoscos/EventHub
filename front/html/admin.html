<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - EventHub</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1>Panel de Administración</h1>
            <div class="admin-header-actions">
                <span id="adminEmail"></span>
                <button id="btnVolver">Volver</button>
            </div>
        </header>

        <nav class="admin-nav">
            <button class="admin-nav-btn active" data-section="crear">Añadir Evento</button>
            <button class="admin-nav-btn" data-section="eliminar">Cancelar Evento</button>
            <button class="admin-nav-btn" data-section="gestionar">Gestionar Evento</button>
            <button class="admin-nav-btn" data-section="usuarios">Gestionar Usuarios</button>
        </nav>

        <main class="admin-main">
            <section id="section-crear" class="admin-section active">
                <h2>Añadir Evento</h2>
                <form id="formCrearEvento">
                    <label>Nombre <input type="text" id="inputNombre" required></label>
                    <label>Descripción <textarea id="inputDescripcion"></textarea></label>
                    <label>Sitio <select id="inputSitioID" required><option value="">-- Selecciona un sitio --</option></select></label>
                    <label>Fecha y hora <input type="datetime-local" id="inputFecha" required></label>
                    <label>Compañía <input type="text" id="inputCompania"></label>
                    <label>Duración (min) <input type="number" id="inputDuracion" required></label>
                    <label>Imagen <input type="file" id="inputImagen" accept="image/*"></label>
                    <button type="submit">Crear Evento</button>
                </form>
                <div id="mensajeCrear" class="admin-mensaje"></div>
            </section>

            <section id="section-eliminar" class="admin-section">
                <h2>Cancelar Evento</h2>
                <p>Selecciona un evento para cancelarlo:</p>
                <select id="selectEliminar"></select>
                <button id="btnEliminar">Cancelar Evento</button>
                <div id="mensajeEliminar" class="admin-mensaje"></div>
            </section>

            <section id="section-gestionar" class="admin-section">
                <h2>Gestionar Evento</h2>
                <p>Selecciona un evento para editar:</p>
                <select id="selectGestionar"></select>
                <form id="formEditarEvento">
                    <label>Nombre <input type="text" id="editNombre" required></label>
                    <label>Descripción <textarea id="editDescripcion"></textarea></label>
                    <label>Sitio <select id="editSitioID" required><option value="">-- Selecciona un sitio --</option></select></label>
                    <label>Fecha y hora <input type="datetime-local" id="editFecha" required></label>
                    <label>Compañía <input type="text" id="editCompania"></label>
                    <label>Duración (min) <input type="number" id="editDuracion" required></label>
                    <label>Estado <select id="editEstado">
                        <option value="disponible">Disponible</option>
                        <option value="realizandose">En emisión</option>
                        <option value="terminado">Terminado</option>
                        <option value="cancelado">Cancelado</option>
                    </select></label>
                    <label>Imagen <input type="file" id="editImagen" accept="image/*"></label>
                    <div id="editImagenPreview" style="margin-bottom:10px"></div>
                    <button type="submit">Guardar Cambios</button>
                </form>
                <div id="mensajeGestionar" class="admin-mensaje"></div>
            </section>

            <section id="section-usuarios" class="admin-section">
                <h2>Gestionar Usuarios</h2>
                <input type="text" id="filtroUsuariosEmail" placeholder="Filtrar por email..." class="admin-filter-input">
                <div id="usuariosList" class="usuarios-scroll"></div>
            </section>
        </main>

        <div class="admin-subpanel">
            <header class="subpanel-header">
                <h2>Gestión de Recintos</h2>
            </header>
            <nav class="subpanel-nav">
                <button class="subpanel-nav-btn active" data-subsection="crear-piso">Añadir Piso</button>
                <button class="subpanel-nav-btn" data-subsection="crear-anfiteatro">Añadir Anfiteatro</button>
                <button class="subpanel-nav-btn" data-subsection="crear-palco">Añadir Palco</button>
                <button class="subpanel-nav-btn" data-subsection="crear-sitio">Añadir Sitio</button>
            </nav>

            <section class="subpanel-section active" id="subsection-crear-piso">
                <h3>Añadir Piso</h3>
                <form id="formCrearPiso">
                    <label>Número de Planta <input type="number" id="inputPisoPlanta" min="0" required></label>
                    <label>Sitio <select id="inputPisoSitio" required><option value="">-- Selecciona un sitio --</option></select></label>
                    <button type="submit">Crear Piso</button>
                </form>
                <div id="mensajeCrearPiso" class="admin-mensaje"></div>
            </section>

            <section class="subpanel-section" id="subsection-crear-anfiteatro">
                <h3>Añadir Anfiteatro</h3>
                <form id="formCrearAnfiteatro">
                    <div class="anfi-grid-row">
                        <label>Precio asiento <input type="number" id="inputAnfiPrecio" step="0.01" required></label>
                        <label>Precio VIP <input type="number" id="inputAnfiPrecioVip" step="0.01"></label>
                    </div>
                    <div class="anfi-grid-row">
                        <label>Filas <input type="number" id="inputAnfiFilas" min="1" max="20" required></label>
                        <label>Columnas <input type="number" id="inputAnfiColumnas" min="1" max="26" required></label>
                    </div>
                    <button type="button" id="btnGenerarGrid">Generar Escenario</button>
                    <div id="anfiGridContainer" class="hidden">
                        <div class="stage-label">ESCENARIO</div>
                        <div class="anfi-grid" id="anfiGrid"></div>
                        <p class="anfi-legend">
                            <span class="legend-item"><span class="legend-box legend-normal"></span> Normal</span>
                            <span class="legend-item"><span class="legend-box legend-vacio"></span> Vacío</span>
                            <span class="legend-item"><span class="legend-box legend-vip"></span> VIP</span>
                        </p>
                    </div>
                    <label>Piso <select id="inputAnfiPiso" required><option value="">-- Selecciona un piso --</option></select></label>
                    <button type="submit" id="btnCrearAnfiteatro" class="hidden">Crear Anfiteatro</button>
                </form>
                <div id="mensajeCrearAnfiteatro" class="admin-mensaje"></div>
            </section>

            <section class="subpanel-section" id="subsection-crear-palco">
                <h3>Añadir Palco</h3>
                <form id="formCrearPalco">
                    <label>Número de asientos <input type="number" id="inputPalcoAsientos" min="1" required></label>
                    <label>Precio del palco <input type="number" id="inputPalcoPrecio" step="0.01" required></label>
                    <label>Sitio <select id="inputPalcoSitio"><option value="">-- Selecciona un sitio --</option></select></label>
                    <label>Piso <select id="inputPalcoPiso" required><option value="">-- Primero selecciona un sitio --</option></select></label>
                    <button type="submit">Crear Palco</button>
                </form>
                <div id="mensajeCrearPalco" class="admin-mensaje"></div>
            </section>

            <section class="subpanel-section" id="subsection-crear-sitio">
                <h3>Añadir Sitio</h3>
                <form id="formCrearSitio">
                    <label>Nombre <input type="text" id="inputSitioNombre" required></label>
                    <label>Aforo <input type="number" id="inputSitioAforo" required></label>
                    <label>URL de Google Maps <input type="url" id="inputSitioUrlMaps" placeholder="https://maps.google.com/?q=..."></label>
                    <button type="submit">Crear Sitio</button>
                </form>
                <div id="mensajeCrearSitio" class="admin-mensaje"></div>
            </section>
        </div>
    </div>

    <script src="../js/admin.js"></script>
    <script src="../js/adminfunctions/eventos.js"></script>
    <script src="../js/adminfunctions/recintos.js"></script>
</body>
</html>
