<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - EventHub</title>
    <link rel="stylesheet" href="../css/register.css">
</head>
<body>
    <header class="auth-header">
        <div class="auth-header-container">
            <img class="logo" src="https://iseldzhneqbgbelnvxck.supabase.co/storage/v1/object/public/eventos/eventos/logo/LogoEventHub%20(1).png" alt="EventHub">
            <a href="/guest" class="btn-volver">Volver a invitado</a>
        </div>
    </header>

    <main class="auth-main">
        <div class="auth-card">
            <h2>Crear Cuenta</h2>
            
            <form id="formRegistro">
                <div class="auth-field">
                    <label for="emailUsuario">Email</label>
                    <input type="email" id="emailUsuario" placeholder="Tu email" required>
                </div>
                <div class="auth-field">
                    <label for="passwordUsuario">Contraseña</label>
                    <input type="password" id="passwordUsuario" placeholder="Elige una contraseña" required>
                </div>
                
                <button type="submit" class="btn-primary">Crear cuenta</button>
                <button type="button" id="btnLogin" class="btn-secondary">Ya tengo cuenta</button>
            </form>

            <p id="mensajeError" class="error"></p>
        </div>
    </main>
    <script src="../js/register.js"></script>
</body>
</html>
