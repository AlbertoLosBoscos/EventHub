<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="../css/register.css">
</head>
<body>
    <div class="login-container">
        <h2>Crear Cuenta</h2>
        
        <form id="formRegistro">
            <input type="email" id="emailUsuario" placeholder="Email" required>
            <input type="password" id="passwordUsuario" placeholder="Contraseña" required>
            
            <button type="submit">Confirmar registro</button>
            <button type="button" id="btnLogin">Iniciar sesión</button>
        </form>

        <p id="mensajeError" class="error"></p>
        
    </div>
    
    <script src="../js/register.js"></script>

</body>
</html>
